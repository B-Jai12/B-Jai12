<svg width="850" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #00ffcc); }
        50% { opacity: 0.4; filter: drop-shadow(0 0 1px #00ffcc); }
      }
      @keyframes scan {
        0% { transform: translateY(0); }
        100% { transform: translateY(240px); }
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      .cursor {
        animation: blink 1s infinite;
      }
      .status-dot {
        animation: pulse 2s infinite ease-in-out;
      }
      .scanline {
        animation: scan 6s linear infinite;
      }
    </style>
    <linearGradient id="cyber-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2430" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="846" height="236" rx="6" fill="#0d1117" stroke="url(#cyber-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="846" height="236" rx="6" fill="url(#grid)"/>

  <!-- Terminal Header Bar -->
  <rect x="3" y="3" width="844" height="34" rx="5" fill="#161b22"/>
  <line x1="2" y1="37" x2="848" y2="37" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal Window Controls -->
  <circle cx="22" cy="20" r="5" fill="#ff5f56" />
  <circle cx="38" cy="20" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="20" r="5" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="76" y="24" fill="#8b949e" class="mono" font-size="12" font-weight="600" letter-spacing="1">SYSTEM // B-JAI12.OS [v2.6.4]</text>

  <!-- Status indicator top-right -->
  <circle cx="778" cy="20" r="4" fill="#00ffcc" class="status-dot"/>
  <text x="790" y="24" fill="#00ffcc" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">ONLINE</text>

  <!-- Interior Body -->
  <!-- Developer Name -->
  <text x="42" y="86" fill="#ffffff" class="mono" font-size="34" font-weight="800" letter-spacing="3">JAIDEEP</text>
  <text x="210" y="86" fill="#00ffcc" class="mono" font-size="14" font-weight="600" letter-spacing="1">/ BOTLA</text>

  <!-- Subtitle / Role -->
  <text x="42" y="118" fill="#8b5cf6" class="mono" font-size="13" font-weight="700" letter-spacing="2">AIML STUDENT &#8226; BUILDER &#8226; CREATIVE TECHNOLOGIST</text>

  <!-- Terminal Prompt Line -->
  <text x="42" y="162" fill="#58a6ff" class="mono" font-size="14" font-weight="600">&gt;</text>
  <text x="62" y="162" fill="#c9d1d9" class="mono" font-size="14" font-weight="500" letter-spacing="0.5">building things that shouldn't be boring</text>
  <rect x="390" y="149" width="9" height="17" fill="#00ffcc" class="cursor"/>

  <!-- Subtext specs / tags -->
  <text x="42" y="202" fill="#484f58" class="mono" font-size="11" letter-spacing="1">CORE: FASTAPI &#8226; GEMINI &#8226; THREE.JS &#8226; DISTRIBUTED WORKSPACES &#8226; TAILWIND</text>

  <!-- Subtle corner aesthetic marks -->
  <path d="M 825 210 L 835 210 L 835 200" fill="none" stroke="#00ffcc" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M 835 50 L 835 42 L 825 42" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>